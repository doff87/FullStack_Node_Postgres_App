<!DOCTYPE html>
<html>
<head>
  <title>Game Items</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Game Items</h1>

<form id="itemForm">
  <input type="text" id="item_name" placeholder="Item Name" required>
  <input type="number" id="value_coins" placeholder="Value (coins)" required>
  <input type="number" step="0.1" id="weight_kg" placeholder="Weight (kg)" required>
  <button type="submit">Add Item</button>
</form>

<button onclick="loadItems()">Load Items</button>
<ul id="list"></ul>

<div class="back-home">
  <a href="index.html">Back to Home</a>
</div>

<script>
  async function loadItems() {
    const res = await fetch('http://localhost:5000/api/items');
    const data = await res.json();
    const list = document.getElementById('list');
    list.innerHTML = '';
    data.forEach(i => {
      const li = document.createElement('li');
      li.textContent = `${i.item_name} — Value: ${i.value_coins} coins, Weight: ${i.weight_kg} kg`;
      list.appendChild(li);
    });
  }

  document.getElementById('itemForm').addEventListener('submit', async e => {
    e.preventDefault();
    await fetch('http://localhost:5000/api/items', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        item_name: document.getElementById('item_name').value,
        value_coins: parseInt(document.getElementById('value_coins').value),
        weight_kg: parseFloat(document.getElementById('weight_kg').value)
      })
    });
    e.target.reset();
    loadItems();
  });
</script>
</body>
</html>
