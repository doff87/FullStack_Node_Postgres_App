<!DOCTYPE html>
<html>
<head>
  <title>Enemies</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Enemies</h1>

<form id="enemyForm">
  <input type="text" id="enemy_name" placeholder="Enemy Name" required>
  <label>
    <input type="checkbox" id="is_ranged"> Ranged
  </label>
  <input type="number" id="experience_points" placeholder="XP" required>
  <button type="submit">Add Enemy</button>
</form>

<button onclick="loadEnemies()">Load Enemies</button>
<ul id="list"></ul>

<div class="back-home">
  <a href="index.html">Back to Home</a>
</div>

<script>
  async function loadEnemies() {
    const res = await fetch('http://localhost:5000/api/enemies');
    const data = await res.json();
    const list = document.getElementById('list');
    list.innerHTML = '';
    data.forEach(e => {
      const li = document.createElement('li');
      li.textContent = `${e.enemy_name} — ${e.is_ranged ? 'Ranged' : 'Melee'}, XP: ${e.experience_points}`;
      list.appendChild(li);
    });
  }

  document.getElementById('enemyForm').addEventListener('submit', async e => {
    e.preventDefault();
    await fetch('http://localhost:5000/api/enemies', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        enemy_name: document.getElementById('enemy_name').value,
        is_ranged: document.getElementById('is_ranged').checked,
        experience_points: parseInt(document.getElementById('experience_points').value)
      })
    });
    e.target.reset();
    loadEnemies();
  });
</script>
</body>
</html>
